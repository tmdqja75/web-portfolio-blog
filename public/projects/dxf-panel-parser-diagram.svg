<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="-apple-system, 'Segoe UI', ui-sans-serif, sans-serif">
  <defs>
    <pattern id="grid-fine" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#171717" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="grid-bold" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#171717" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <rect width="1200" height="680" fill="url(#grid-fine)"/>
  <rect width="1200" height="680" fill="url(#grid-bold)"/>

  <!-- Section 1: pipeline -->
  <text x="40" y="34" font-size="12" font-weight="600" letter-spacing="1.5" fill="#888888">PIPELINE</text>
  <text x="40" y="58" font-size="14" fill="#4d4d4d">도면 이미지를 구조화된 회로표 데이터로 변환하는 5단계</text>

  <!-- connectors -->
  <g stroke="#888888" stroke-width="2" fill="#888888">
    <line x1="220" y1="150" x2="262" y2="150"/>
    <polygon points="262,145 270,150 262,155"/>
    <line x1="456" y1="150" x2="498" y2="150"/>
    <polygon points="498,145 506,150 498,155"/>
    <line x1="692" y1="150" x2="734" y2="150"/>
    <polygon points="734,145 742,150 734,155"/>
    <line x1="928" y1="150" x2="970" y2="150"/>
    <polygon points="970,145 978,150 970,155"/>
  </g>

  <!-- box 1 -->
  <g>
    <rect x="40" y="90" width="176" height="120" rx="8" fill="#ffffff" stroke="#a1a1a1" stroke-width="1"/>
    <circle cx="58" cy="90" r="14" fill="#171717"/>
    <text x="58" y="95" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
    <text x="128" y="148" font-size="15" font-weight="600" fill="#171717" text-anchor="middle">DWG 원본 도면</text>
    <text x="128" y="172" font-size="12" fill="#888888" text-anchor="middle">(설비 CAD 원본)</text>
  </g>

  <!-- box 2 -->
  <g>
    <rect x="276" y="90" width="176" height="120" rx="8" fill="#ffffff" stroke="#a1a1a1" stroke-width="1"/>
    <circle cx="294" cy="90" r="14" fill="#171717"/>
    <text x="294" y="95" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
    <text x="364" y="148" font-size="15" font-weight="600" fill="#171717" text-anchor="middle">DXF 변환</text>
    <text x="364" y="172" font-size="12" fill="#888888" text-anchor="middle">(ODA Converter)</text>
  </g>

  <!-- box 3 -->
  <g>
    <rect x="512" y="90" width="176" height="120" rx="8" fill="#ffffff" stroke="#a1a1a1" stroke-width="1"/>
    <circle cx="530" cy="90" r="14" fill="#171717"/>
    <text x="530" y="95" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
    <text x="600" y="148" font-size="15" font-weight="600" fill="#171717" text-anchor="middle">분전반 영역 탐지</text>
    <text x="600" y="172" font-size="12" fill="#888888" text-anchor="middle">(ezdxf 기하 연산)</text>
  </g>

  <!-- box 4 -->
  <g>
    <rect x="748" y="90" width="176" height="120" rx="8" fill="#ffffff" stroke="#a1a1a1" stroke-width="1"/>
    <circle cx="766" cy="90" r="14" fill="#171717"/>
    <text x="766" y="95" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
    <text x="836" y="148" font-size="15" font-weight="600" fill="#171717" text-anchor="middle">한글 폰트 렌더링</text>
    <text x="836" y="172" font-size="12" fill="#888888" text-anchor="middle">(SHX 오버라이드)</text>
  </g>

  <!-- box 5 -->
  <g>
    <rect x="984" y="90" width="176" height="120" rx="8" fill="#ffffff" stroke="#a1a1a1" stroke-width="1"/>
    <circle cx="1002" cy="90" r="14" fill="#171717"/>
    <text x="1002" y="95" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
    <text x="1072" y="148" font-size="15" font-weight="600" fill="#171717" text-anchor="middle">VLM 회로표 추출</text>
    <text x="1072" y="172" font-size="12" fill="#888888" text-anchor="middle">(Claude · GPT)</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="234" x2="1160" y2="234" stroke="#ebebeb" stroke-width="1.5"/>

  <!-- Section 2: accuracy experiment -->
  <text x="40" y="258" font-size="12" font-weight="600" letter-spacing="1.5" fill="#888888">EXPERIMENT</text>
  <text x="40" y="280" font-size="14" fill="#4d4d4d">3단계 프롬프트 개선으로 두 모델이 모두 맞힌 정답률을 끌어올린 실험</text>

  <!-- gridlines -->
  <g stroke="#ebebeb" stroke-width="1" stroke-dasharray="4 4">
    <line x1="220" y1="310" x2="1080" y2="310"/>
    <line x1="220" y1="440" x2="1080" y2="440"/>
  </g>
  <g font-size="11" fill="#888888" text-anchor="end" font-family="ui-monospace, monospace">
    <text x="190" y="314">100%</text>
    <text x="190" y="444">50%</text>
    <text x="190" y="574">0%</text>
  </g>

  <!-- baseline -->
  <line x1="200" y1="570" x2="1080" y2="570" stroke="#a1a1a1" stroke-width="1.5"/>

  <!-- bar 1: 35.0% -->
  <rect x="330" y="479" width="140" height="91" rx="4" fill="#d3e5ff"/>
  <text x="400" y="465" font-size="28" font-weight="600" fill="#171717" text-anchor="middle">35.0%</text>
  <text x="400" y="598" font-size="14" font-weight="600" fill="#171717" text-anchor="middle">① 원본 이미지</text>
  <text x="400" y="618" font-size="12" fill="#888888" text-anchor="middle">(그대로 입력)</text>

  <!-- bar 2: 72.9% -->
  <rect x="580" y="380" width="140" height="190" rx="4" fill="#0070f3"/>
  <text x="650" y="366" font-size="28" font-weight="600" fill="#171717" text-anchor="middle">72.9%</text>
  <text x="650" y="598" font-size="14" font-weight="600" fill="#171717" text-anchor="middle">② 크롭 + 프롬프트</text>
  <text x="650" y="618" font-size="12" fill="#888888" text-anchor="middle">(빈 행 제거)</text>

  <!-- bar 3: 91.7% -->
  <rect x="830" y="332" width="140" height="238" rx="4" fill="#0761d1"/>
  <text x="900" y="318" font-size="28" font-weight="600" fill="#171717" text-anchor="middle">91.7%</text>
  <text x="900" y="598" font-size="14" font-weight="600" fill="#171717" text-anchor="middle">③ + Few-shot</text>
  <text x="900" y="618" font-size="12" fill="#888888" text-anchor="middle">(예시 추가)</text>

  <text x="40" y="650" font-size="12" fill="#888888">* GPT-4o · Claude 3.5 Sonnet 교차 채점, 자체 제작 사람 투표 평가 도구 기준 — 두 모델 모두 정답인 비율</text>
</svg>
